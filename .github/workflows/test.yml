name: Test Environment & Build Checks

on:
  push:
    branches:
      - test
      - main
  pull_request:
    branches:
      - test
      - main

jobs:
  test-environment:
    name: Test & Build Verification
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting
        run: npm run lint

      - name: Run Production Build
        run: npm run build
